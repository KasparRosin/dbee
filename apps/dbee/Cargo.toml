[package]
name = "dbee"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "dbee"
description = "dbee desktop app"

[lints]
workspace = true

[dependencies]
dbee-ui-egui = { workspace = true }
dbee-engine = { workspace = true }
dbee-config = { workspace = true }
dbee-ssh = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
log = { workspace = true }
image = { workspace = true }

[dev-dependencies]
# tests/m1_day.rs: the test servers, the skip rule and psql; JSON lines on the control channel.
dbee-testkit = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for dbee.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
# Blocks on the start-up DirectX 12 adapter probe (`graphics.rs`); already in the tree via eframe.
pollster = "1"
