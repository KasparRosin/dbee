[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/KasparRosin/dbee"
homepage = "https://dbee.rosin.dev"
description = "A cross-platform desktop database client, written in Rust."

[workspace.dependencies]
# internal
dbee-core = { path = "crates/core" }
dbee-sql = { path = "crates/sql" }
dbee-config = { path = "crates/config" }
dbee-ssh = { path = "crates/ssh" }
dbee-driver = { path = "crates/driver" }
dbee-pg = { path = "crates/pg" }
dbee-drivers = { path = "crates/drivers" }
dbee-engine = { path = "crates/engine" }
dbee-ui-egui = { path = "crates/ui-egui" }
dbee-mcp = { path = "crates/mcp" }
dbee-testkit = { path = "crates/testkit" }

# foundation
serde = { version = "1", features = ["derive"] }
# `preserve_order` here, not in one crate: `-p dbee` (run-isolated, the app) then resolves the same
# features as `--workspace` (ci, the tests), so the app runs what the tests run and egui and wgpu are
# built once.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
log = "0.4"
proptest = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

# network
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
# Pinned exactly: dbee-pg classifies its errors by their Display texts (its error kinds are private),
# so a new version must be checked against crates/pg/src/error.rs before it is taken.
tokio-postgres = "=0.7.18"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
futures-util = "0.3"

# storage
# SQLite compiled in (public domain, docs/standards/licensing.md); the crates are MIT.
rusqlite = { version = "0.40", features = ["bundled"] }

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_extras = { version = "0.36", default-features = false }
egui_kittest = "0.36"
# The file picker: the XDG desktop portal on Linux and the BSDs (no GTK), native elsewhere.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
