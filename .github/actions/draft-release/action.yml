name: "Draft GitHub Release"
description: "Collects release artifacts, computes sha256 checksums, signs them, and creates or updates a draft GitHub Release"

inputs:
  version:
    description: "Release version string without 'v' prefix"
    required: true
  prerelease:
    description: "Whether release is marked as prerelease"
    required: false
    default: "false"
  signing-key:
    description: "The release key: an ed25519 private key in PEM (PKCS#8). Empty: the release is not signed"
    required: false
    default: ""
  github-token:
    description: "GitHub token for authenticating gh CLI"
    required: true

runs:
  using: "composite"
  steps:
    - name: Download all release artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: release-*
        path: artifacts
        merge-multiple: true

    - name: Compute checksums
      shell: bash
      working-directory: artifacts
      run: |
        rm -f SHA256SUMS.txt SHA256SUMS.txt.sig
        sha256sum -- * | tee SHA256SUMS.txt

    # The signature is the 64 raw bytes of ed25519 over the checksum file, which the app will
    # check against the keys compiled into it before it installs anything
    # (crates/update/src/signature.rs; no copy fetches it yet).
    - name: Sign the checksums
      shell: bash
      working-directory: artifacts
      env:
        SIGNING_KEY: ${{ inputs.signing-key }}
      run: |
        if [ -z "$SIGNING_KEY" ]; then
          echo "::warning::The release is not signed: RELEASE_SIGNING_KEY is empty. Add it to the release environment (docs/releasing.md)."
          exit 0
        fi
        key="$(mktemp "$RUNNER_TEMP/release-key.XXXXXX")"
        trap 'rm -f "$key"' EXIT
        printf '%s\n' "$SIGNING_KEY" >"$key"
        openssl pkeyutl -sign -rawin -inkey "$key" -in SHA256SUMS.txt -out SHA256SUMS.txt.sig
        [ "$(stat -c %s SHA256SUMS.txt.sig)" = 64 ] || { echo "::error::The signature is not 64 bytes long."; exit 1; }

    # With a key pinned in this tree, a release without a signature by it is refused here, before
    # anyone can publish it. The keys are this release's own: the copies in use hold the keys of
    # the release they were built from (docs/releasing.md, replacing a key).
    - name: Check the release as the app will
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        rustup toolchain install
        cargo run --locked -p dbee-update --example check_release -- artifacts "$VERSION"

    - name: Create or update draft release
      shell: bash
      working-directory: artifacts
      env:
        VERSION: ${{ inputs.version }}
        PRERELEASE: ${{ inputs.prerelease }}
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
      run: |
        tag="v$VERSION"
        title="$tag"
        pre=()
        if [ "$PRERELEASE" = "true" ]; then pre=(--prerelease); fi
        if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
          if [ "$draft" != "true" ]; then
            echo "::error::Release $tag is already published. Bump the version (cargo xtask version set) before pushing to release."
            exit 1
          fi
          echo "Updating draft $tag: replacing its assets"
          gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
            gh release delete-asset "$tag" "$asset" --yes
          done
          gh release edit "$tag" --draft --title "$title" --target "$GITHUB_SHA" --prerelease="$PRERELEASE"
          gh release upload "$tag" --clobber -- *
        else
          echo "Creating draft $tag"
          gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" --generate-notes "${pre[@]}" -- *
        fi
        {
          echo "Draft release **$title** at \`${GITHUB_SHA::9}\`:"
          echo
          sed 's/^/    /' SHA256SUMS.txt
        } >>"$GITHUB_STEP_SUMMARY"
