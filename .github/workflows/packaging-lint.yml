name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/**", "packaging/**", "assets/app-icon/**"]
  pull_request:
    paths: [".github/**", "packaging/**", "assets/app-icon/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/packaging-lint
