# The AGENTS.md quality gate (`cargo xtask ci`: fmt, clippy -D warnings, test, assets, tokens,
# layers, provenance) on every pull request and every push to main, so a merge burst can't land
# a red tree that nobody notices until the next change. After it, the end-to-end tests drive the
# real app in a window under Xvfb.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: cargo xtask ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # No debug info in CI builds: with it, the test binaries most likely filled the runner's
      # disk (the linker died with a bus error). Failing asserts still name their file and line.
      CARGO_PROFILE_DEV_DEBUG: "0"
      DBEE_REQUIRE_ORACLES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies (winit, wgpu, rfd) and Xvfb for the window tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers \
            xvfb xauth libxkbcommon-x11-0

      - name: Install Rust (the release, profile and components in rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Quality gate
        run: cargo xtask ci

      # The test servers are still up from the gate, and these test binaries were built by it.
      - name: End-to-end tests (the real app in a window, under Xvfb)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            cargo test --workspace --test m1_day --test m2_day --test control_access --test update_check -- --ignored --nocapture

      - name: Upload the end-to-end screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: |
            target/m1-day/
            target/m2-day/
            target/control-access/
          if-no-files-found: ignore
          retention-days: 7

      - name: Free disk space at the end (tells a full disk from other failures)
        if: always()
        run: |
          df -h / /tmp
          du -sh target 2>/dev/null || true
