# Flatpak manifest for dbee, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/dev.rosin.dbee.yml
#   flatpak run dev.rosin.dbee
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
# The single-file .flatpak attached to each release comes from dev.rosin.dbee.bundle.yml,
# which repackages the prebuilt release binaries. Keep runtime-version and finish-args identical.
id: dev.rosin.dbee
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: dbee
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for rendering.
  - --device=dri
  # Open/Save dialogs use the file-chooser portal (rfd), and drag-and-drop uses the document
  # portal, so broad filesystem access isn't needed. Documents and Downloads are granted for
  # opening database files by path from the command line.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  # Network: connections to PostgreSQL, MySQL and other database servers.
  - --share=network
  # SSH tunnels: keys and known_hosts (read-only), and the SSH agent.
  - --filesystem=~/.ssh:ro
  - --socket=ssh-auth
  # Deliberately not granted: the rest of the home and host filesystem.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: dbee
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/dbee/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p dbee -p dbee-cli
      - install -Dm755 target/release/dbee /app/bin/dbee
      - install -Dm755 target/release/dbee-cli /app/bin/dbee-cli
      - install -Dm644 packaging/linux/dev.rosin.dbee.desktop /app/share/applications/dev.rosin.dbee.desktop
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/dev.rosin.dbee.metainfo.xml.in > /app/share/metainfo/dev.rosin.dbee.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - target-xtask
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
