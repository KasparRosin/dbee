# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} (nfpm doesn't expand env vars in `src`) and
# exports VERSION and NFPM_ARCH.
#
#   nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/release/
name: dbee
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
release: 1
section: misc
priority: optional
maintainer: Kaspar Rosin <kaspar@rosin.dev>
vendor: Kaspar Rosin
homepage: https://dbee.rosin.dev
license: MIT OR Apache-2.0
description: |-
  Desktop database client.
  Browse, filter and edit PostgreSQL databases.

# The binaries link only glibc and libgcc_s directly. Windowing (X11/Wayland, xkbcommon) and the
# GPU (Vulkan, EGL/GL) are loaded at runtime, so they are dependencies/recommendations here
# rather than ELF NEEDED entries.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libxkbcommon0
      - libvulkan1 | libegl1
    recommends:
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxkbcommon-x11-0
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
  # By the libraries' file names, not package names: Fedora, RHEL and openSUSE name the packages
  # differently, and each of them resolves these.
  rpm:
    depends:
      - libxkbcommon.so.0()(64bit)
      - (libvulkan.so.1()(64bit) or libEGL.so.1()(64bit))
    recommends:
      - libwayland-client.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libXrandr.so.2()(64bit)
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/dbee
    dst: /usr/bin/dbee
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/dbee-cli
    dst: /usr/bin/dbee-cli
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
