# dbee test servers, local and test-only: Postgres 14 and the newest Postgres major; MySQL 5.7, 8.0
# and the newest; MariaDB 10.11 and the newest; an SSH server.
# Managed by `cargo xtask testdb up|down|status` (xtask/src/testdb.rs), which writes the variables
# below to target/testdb/compose.env. Each database service's image comes from its row in
# SERVICES there (DBEE_IMAGE_<SERVICE>), and the certificate's names and the sshd's forwards from
# the same list. By hand:
#   docker compose -p dbee-testdb -f xtask/testdb/compose.yml --env-file target/testdb/compose.env ps
name: dbee-testdb

x-after-init: &after-init
  init:
    condition: service_completed_successfully

x-postgres: &postgres
  depends_on: *after-init
  environment:
    POSTGRES_PASSWORD: ${DBEE_TEST_PASSWORD:?run cargo xtask testdb up}
    POSTGRES_DB: dbee
  command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/secrets/server.crt", "-c", "ssl_key_file=/secrets/server.key"]
  volumes:
    - secrets:/secrets:ro
    - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
  ports:
    - "127.0.0.1::5432"
  shm_size: 256m
  # The entrypoint seeds on a socket-only server, so TCP answers only once the seed is in.
  healthcheck:
    test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-U", "postgres", "-d", "dbee"]
    interval: 5s
    timeout: 5s
    retries: 5
    start_period: 900s
    start_interval: 2s

# MySQL and MariaDB. The images' entrypoints put `mysqld`/`mariadbd` before arguments that start
# with `-`, so both flavours take the same ones. They seed on a server without networking, so
# TCP answers only once the seed is in. The root password is the test password. Their certificate
# is RSA (mysql/server.crt): MySQL 5.7's image offers no cipher for the ECDSA one.
x-mysql-args: &mysql-args
  - --max_allowed_packet=67108864
  - --character-set-server=utf8mb4
  - --ssl-ca=/secrets/ca.crt
  - --ssl-cert=/secrets/mysql/server.crt
  - --ssl-key=/secrets/mysql/server.key
  - --skip-name-resolve
  # Light on memory and disk: five of these run next to the Postgres servers.
  - --performance_schema=OFF
  - --innodb_buffer_pool_size=64M
  - --innodb_flush_log_at_trx_commit=0
  - --skip-log-bin

x-mysql: &mysql
  depends_on: *after-init
  environment:
    MYSQL_ROOT_PASSWORD: ${DBEE_TEST_PASSWORD:?run cargo xtask testdb up}
  command: *mysql-args
  volumes:
    - secrets:/secrets:ro
    - ./seed-mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro
  ports:
    - "127.0.0.1::3306"
  healthcheck:
    # Without TLS: a TLS fault shows in `testdb up`'s TLS check, not as a server that never gets healthy.
    test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--protocol=TCP", "--ssl-mode=DISABLED", "--silent"]
    interval: 5s
    timeout: 5s
    retries: 5
    start_period: 900s
    start_interval: 2s

x-mariadb: &mariadb
  depends_on: *after-init
  environment:
    MARIADB_ROOT_PASSWORD: ${DBEE_TEST_PASSWORD:?run cargo xtask testdb up}
  command: *mysql-args
  volumes:
    - secrets:/secrets:ro
    - ./seed-mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro
  ports:
    - "127.0.0.1::3306"
  healthcheck:
    test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
    interval: 5s
    timeout: 5s
    retries: 5
    start_period: 900s
    start_interval: 2s

services:
  # Builds the tools image; `sshd` runs the same image. Only one service builds it, so a cached
  # rebuild keeps the image id and `up --build` reuses the running containers.
  init:
    build:
      context: .
      dockerfile: tools.Dockerfile
    image: dbee-testdb-tools:local
    command: ["/usr/local/bin/tools-init.sh"]
    environment:
      DBEE_TEST_PASSPHRASE: ${DBEE_TEST_PASSPHRASE:?run cargo xtask testdb up}
      DBEE_TEST_HOSTS: ${DBEE_TEST_HOSTS:?run cargo xtask testdb up}
    volumes:
      - secrets:/secrets
    restart: "no"

  pg14:
    <<: *postgres
    image: ${DBEE_IMAGE_PG14:?run cargo xtask testdb up}

  pgnew:
    <<: *postgres
    image: ${DBEE_IMAGE_PGNEW:?run cargo xtask testdb up}

  # The seed reads the hostname: mysql80 and mariadbnew get the big tables (seed-mysql.sql).
  mysql57:
    <<: *mysql
    image: ${DBEE_IMAGE_MYSQL57:?run cargo xtask testdb up}
    hostname: mysql57

  mysql80:
    <<: *mysql
    image: ${DBEE_IMAGE_MYSQL80:?run cargo xtask testdb up}
    hostname: mysql80

  mysqlnew:
    <<: *mysql
    image: ${DBEE_IMAGE_MYSQLNEW:?run cargo xtask testdb up}
    hostname: mysqlnew

  mariadb1011:
    <<: *mariadb
    image: ${DBEE_IMAGE_MARIADB1011:?run cargo xtask testdb up}
    hostname: mariadb1011

  mariadbnew:
    <<: *mariadb
    image: ${DBEE_IMAGE_MARIADBNEW:?run cargo xtask testdb up}
    hostname: mariadbnew

  sshd:
    image: dbee-testdb-tools:local
    pull_policy: never
    depends_on: *after-init
    # Forwards only to the database servers, from SERVICES (DBEE_TEST_FORWARDS, comma-separated).
    command:
      - sh
      - -c
      - echo "dbeepw:$${DBEE_TEST_PASSWORD}" | chpasswd >/dev/null && exec /usr/sbin/sshd -D -e -o "PermitOpen=$$(echo "$${DBEE_TEST_FORWARDS}" | tr , ' ')"
    environment:
      DBEE_TEST_PASSWORD: ${DBEE_TEST_PASSWORD:?run cargo xtask testdb up}
      DBEE_TEST_FORWARDS: ${DBEE_TEST_FORWARDS:?run cargo xtask testdb up}
    volumes:
      - secrets:/secrets:ro
    ports:
      - "127.0.0.1::22"
    healthcheck:
      test: ["CMD", "test", "-s", "/run/sshd.pid"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s

volumes:
  secrets:
